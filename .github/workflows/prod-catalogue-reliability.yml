name: Production reliability isolated verification

on:
  push:
    branches:
      - codex/prod-catalogue-reliability-20261103
    paths:
      - .github/workflows/prod-catalogue-reliability.yml
      - src/workspaces/storefront/checkout/actions.ts
      - src/workspaces/storefront/catalog/queries.ts
      - scripts/test-storefront-catalog-diagnostics.mjs
      - scripts/test-checkout-option-logging.mjs
      - scripts/test-release-regressions.mjs
      - package.json
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: prod-catalogue-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: project_flour_regression
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gha-regression-only
        options: >-
          --health-cmd "pg_isready -U postgres -d project_flour_regression"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify exact event source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
      - name: Install lockfile dependencies
        run: npm ci
      - name: Checkout option logging contract
        run: node scripts/test-checkout-option-logging.mjs
      - name: Storefront catalogue diagnostics contract
        run: node scripts/test-storefront-catalog-diagnostics.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Changed-file ESLint
        run: ./node_modules/.bin/eslint --no-cache src/workspaces/storefront/checkout/actions.ts src/workspaces/storefront/catalog/queries.ts scripts/test-checkout-option-logging.mjs scripts/test-storefront-catalog-diagnostics.mjs
      - name: Existing full release regressions
        env:
          RELEASE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: npm run test:release-regressions
      - name: Production build
        run: npm run build
