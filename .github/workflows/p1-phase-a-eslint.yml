name: Phase A ESLint (pinned candidate)

on:
  push:
    branches:
      - codex/storefront-reliability-phase2-20261023
    paths:
      - .github/workflows/p1-phase-a-eslint.yml

permissions:
  contents: read

concurrency:
  group: p1-phase-a-eslint
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase A candidate
        uses: actions/checkout@v4
        with:
          ref: b3ecb6792d99d00ecf3e77254a2e16785f86b1ec
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint the six Phase A files
        run: >-
          ./node_modules/.bin/eslint --no-cache
          src/components/ui/CakePhotoImage.tsx
          src/workspaces/storefront/StorefrontRetryNotice.tsx
          src/workspaces/storefront/catalog/StorefrontCakeDetail.tsx
          src/workspaces/storefront/catalog/queries.ts
          src/workspaces/storefront/home/StorefrontBrowsePage.tsx
          src/workspaces/storefront/home/StorefrontHomePage.tsx
