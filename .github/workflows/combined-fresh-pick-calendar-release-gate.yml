name: Combined Fresh Pick and Calendar candidate gate
on:
  push:
    branches:
      - codex/expired-fresh-pick-bakery-management-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: project_flour_regression
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: gha-regression-only
        options: >-
          --health-cmd "pg_isready -U postgres -d project_flour_regression"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact candidate dependencies
        run: npm ci
      - name: Focused and isolated database regression suite
        env:
          RELEASE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: npm run test:release-regressions
      - name: Four-migration rehearsal and two-session recovery boundary
        env:
          RELEASE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/test-expired-fresh-pick-migration-sequence-postgres.sh
      - name: Production build and TypeScript
        run: npm run build
      - name: Strict ESLint on release application changes
        run: >-
          npx eslint
          src/engines/extra/expired-stock-recovery.ts
          src/workspaces/extra/ExtraBoard.tsx
          src/workspaces/extra/queries.ts
          src/workspaces/owner/calendar/matrix.ts
          src/workspaces/owner/calendar/queries.ts
          src/workspaces/owner/calendar/types.ts
      - name: Report inherited full-repository ESLint debt
        continue-on-error: true
        run: npm run lint
